<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111316">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Recorrido 3D">
<meta name="description" content="Puntuación de recorridos de tiro con arco 3D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Recorrido 3D</title>
<style>
:root{--y:#ffd21f;--r:#e3262e;--b:#1f7fe0;--k:#0a0a0a;--w:#f7f7f2;--abh:64px}
[data-theme=dark]{--bg:#0b0c0e;--bar:#111316;--s1:#16181c;--s2:#1f2228;--s3:#343842;--line:#2a2d34;--ink:#f4f4ef;--mut:#989da7;--prim:#ffd21f;--primInk:#111;--acc:#ffd21f;--shadow:0 6px 22px #0007;color-scheme:dark}
[data-theme=light]{--bg:#f2f1ec;--bar:#ffffff;--s1:#ffffff;--s2:#f2f1ec;--s3:#cfccc2;--line:#dedbd1;--ink:#15161a;--mut:#676a72;--prim:#15161a;--primInk:#ffd21f;--acc:#e3262e;--shadow:0 6px 18px #0000001a;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{min-height:100vh;padding-bottom:calc(170px + env(safe-area-inset-bottom));overscroll-behavior-y:none}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h2{font-size:19px;margin:0;letter-spacing:-.2px}h3{font-size:15px;margin:0}
.mut{color:var(--mut);font-size:13.5px;line-height:1.45}

/* Cabecera con anillos */
.appbar{position:sticky;top:0;z-index:20;overflow:hidden;background:var(--bar);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 14px 10px}
.appbar .rings{position:absolute;right:-64px;top:50%;width:230px;height:230px;transform:translateY(-50%);opacity:.28;pointer-events:none}
.appbar .in{position:relative;display:flex;align-items:center;gap:12px;max-width:760px;margin:auto}
.logo{width:40px;height:40px;flex:none;filter:drop-shadow(0 2px 6px #0005)}
.ttl{flex:1;min-width:0}
.ttl h1{margin:0;font-size:20px;letter-spacing:-.4px;font-weight:850;line-height:1.1}
.ttl p{margin:2px 0 0;font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--s2);border:1px solid var(--line)}
.iconbtn svg{width:21px;height:21px}
main{max-width:760px;margin:auto;padding:12px}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border-radius:13px;background:var(--s2);border:1px solid var(--line);font-weight:750;font-size:15px;text-align:center;line-height:1.2}
.btn:active{transform:scale(.98)}
.btn.prim{background:var(--prim);color:var(--primInk);border-color:transparent}
.btn.wa{background:#1fa855;color:#fff;border-color:transparent}
.btn.danger{background:transparent;color:var(--r);border-color:#e3262e66}
.btn.wide{width:100%}
.btn.opt{flex-direction:column;gap:2px;padding:12px 14px}.btn.opt small{font-weight:500;opacity:.8;font-size:12.5px}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px;border-radius:10px}
.btn svg{width:18px;height:18px;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stack{display:grid;gap:8px}

.card{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px;box-shadow:var(--shadow)}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 4px 0}
.count{background:var(--s2);border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:800;color:var(--mut)}
.empty{text-align:center;padding:34px 18px}
.empty svg{width:120px;height:120px;margin-bottom:10px}
.empty b{display:block;font-size:18px;margin-bottom:6px}
.empty .btn{margin-top:16px}

/* Barra de diana */
.tbar{position:sticky;top:var(--abh);z-index:15;display:grid;grid-template-columns:58px 1fr 58px;gap:8px;align-items:center;margin:-12px -12px 0;padding:10px 12px 8px;background:var(--bg)}
.tbar .nav{height:58px;border-radius:16px;background:var(--s1);border:1px solid var(--line);font-size:30px;font-weight:600;line-height:1}
.tnum{height:58px;border-radius:16px;background:var(--s1);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px}
.tnum small{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--mut)}
.tnum b{font-size:32px;font-weight:900;letter-spacing:-1px;color:var(--acc)}
.tnum span{font-size:13px;color:var(--mut);font-weight:650}
.prog{height:6px;border-radius:9px;background:var(--s2);overflow:hidden;margin:2px 0 4px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--r),var(--y));transition:width .3s}

.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin-top:10px;padding:12px;background:var(--s1);border:1px solid var(--line);border-radius:16px}
.tile{height:44px;border-radius:12px;background:var(--s2);border:1px solid var(--line);font-weight:800;font-size:15px;color:var(--mut)}
.tile.part{border:2px solid var(--r);color:var(--ink)}
.tile.ok{background:var(--y);border-color:var(--y);color:#111}
.tile.cur{outline:3px solid var(--ink);outline-offset:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:8px 4px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;background:var(--s2);border:1px solid var(--line);vertical-align:-2px;margin-right:5px}
.legend i.ok{background:var(--y);border-color:var(--y)}.legend i.part{border:2px solid var(--r)}

/* Colores de puntuación (anillos de diana) */
.v11{background:var(--y);color:#111}
.v10{background:var(--r);color:#fff}
.v8{background:var(--b);color:#fff}
.v5{background:var(--k);color:#fff;box-shadow:inset 0 0 0 2px #50545d}
.v0{background:var(--w);color:#111;box-shadow:inset 0 0 0 2px #c9c8bf}

.ac{transition:border-color .2s}
.ac.done{border-color:#ffd21f99}
.ac.flash{animation:flash .9s}
@keyframes flash{0%{box-shadow:0 0 0 0 #ffd21fcc}100%{box-shadow:0 0 0 16px #ffd21f00}}
.ah{display:flex;align-items:flex-start;gap:10px}
.an{flex:1;min-width:0}
.nm{font-weight:800;font-size:17px;overflow-wrap:anywhere}.an{cursor:pointer}.nm::after{content:" ›";color:var(--mut);font-weight:600}
.ct{font-size:12px;color:var(--mut);margin-top:2px}
.at{text-align:right;flex:none}
.at b{display:block;font-size:22px;line-height:1;font-weight:850}
.at span{display:block;font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin-top:3px}
.at small{display:block;margin-top:5px;font-size:12.5px;font-weight:800;color:var(--ink);background:var(--s2);border:1px solid var(--line);border-radius:8px;padding:2px 7px}
.upto{display:grid;grid-template-columns:48px 1fr 48px;gap:6px;margin-top:10px}
.upto button{height:48px;border-radius:12px;background:var(--s1);border:1px solid var(--line);font-size:24px}
.upto select{font-weight:800}
.prog-t{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
.prog-t th{font-size:10.5px;text-transform:uppercase;color:var(--mut);font-weight:800;padding:6px 4px;border-bottom:1px solid var(--line);text-align:center}
.prog-t td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:center}
.prog-t td:last-child{font-weight:900}
.prog-t .dot{width:26px;height:26px;font-size:12px;display:inline-grid;margin:0 1px}
.row2{display:flex;align-items:center;gap:10px;margin-top:12px}
.slot{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:20px;font-weight:850;flex:none;position:relative}
.slot:not(.empty)::after{content:"";position:absolute;inset:5px;border-radius:50%;border:1.5px solid #0000002e}
.slot.v5::after{border-color:#ffffff26}
.slot.empty{border:2px dashed var(--s3);color:var(--mut);font-size:13px;font-weight:700}
.slot.sel{outline:3px solid var(--ink);outline-offset:3px;animation:pulse 1s infinite alternate}
@keyframes pulse{to{outline-offset:6px}}
.tsum{margin-left:4px}
.tsum b{font-size:28px;font-weight:900;line-height:1}
.tsum span{display:block;font-size:11px;color:var(--mut)}
.clr{margin-left:auto;width:42px;height:42px;border-radius:12px;background:var(--s2);border:1px solid var(--line);color:var(--mut);font-size:15px}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.sb{height:60px;border-radius:15px;font-size:23px;font-weight:900;position:relative;transition:transform .07s}
.sb::after{content:"";position:absolute;inset:6px;border-radius:11px;border:1.5px solid #0000002b;pointer-events:none}
.sb.v5::after{border-color:#ffffff22}
.sb:active{transform:scale(.92)}
.ac.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hint{font-size:12.5px;color:var(--acc);font-weight:700;margin-top:8px;text-align:center}

.nextbar{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:25;max-width:736px;margin:auto;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 16px;border-radius:16px;background:var(--y);color:#111;font-weight:850;box-shadow:0 8px 30px #0008;animation:up .3s both}
.nextbar button{margin-left:auto;background:#111;color:var(--y);padding:11px 14px;border-radius:12px;font-weight:850;white-space:nowrap}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.fab{position:fixed;right:14px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:24;display:flex;align-items:center;gap:6px;padding:11px 15px;border-radius:99px;background:var(--s2);border:1px solid var(--line);box-shadow:var(--shadow);font-weight:800;font-size:14px}
.fab.up{bottom:calc(146px + env(safe-area-inset-bottom))}

/* Pestañas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bar);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:760px;margin:auto}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:12px;color:var(--mut);font-size:11px;font-weight:750}
.tabs svg{width:24px;height:24px}
.tabs button.on{color:var(--ink)}
.tabs button.on svg{color:var(--acc)}

/* Clasificación */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{padding:10px 6px;border-radius:10px;font-weight:800;font-size:14px;color:var(--mut)}
.seg button.on{background:var(--prim);color:var(--primInk)}
.podium{display:grid;grid-template-columns:1fr 1.12fr 1fr;align-items:end;gap:8px;margin:14px 0 6px}
.pod{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.pod .pn{font-weight:800;font-size:13.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.pod .pp{font-size:21px;font-weight:900}
.pod .pn,.pod .pp,.pod .medal{animation:fade .45s both;animation-delay:calc(var(--d) + .45s)}
.medal{font-size:26px;line-height:1}
.blk{width:100%;border-radius:14px 14px 4px 4px;display:grid;place-items:start center;padding-top:8px;font-weight:900;font-size:28px;color:#111;transform-origin:bottom;animation:rise .7s cubic-bezier(.2,.9,.3,1.15) both;animation-delay:var(--d);background-image:radial-gradient(circle at 50% 120%,transparent 0 20px,#0000000f 20px 24px,transparent 24px 40px,#0000000f 40px 44px,transparent 44px)}
.p1 .blk{height:112px}.p2 .blk{height:82px}.p3 .blk{height:62px}
.mini .p1 .blk{height:70px}.mini .p2 .blk{height:52px}.mini .p3 .blk{height:40px;font-size:22px}
.gold .blk{background-color:#ffd21f}.silver .blk{background-color:#c9cdd5}.bronze .blk{background-color:#d08a4c}
@keyframes rise{from{transform:scaleY(0)}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.tw{overflow-x:auto;margin:6px -4px 0}
.rt{width:100%;border-collapse:collapse;font-size:14px}
.rt th{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);font-weight:800;padding:6px 6px;text-align:right;border-bottom:1px solid var(--line)}
.rt td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
.rt th:nth-child(2),.rt td:nth-child(2){text-align:left;width:100%}
.rt th:first-child,.rt td:first-child{text-align:center;width:40px}
.rt tr[data-stat]{cursor:pointer}
.rt tr[data-stat]:active{background:var(--s2)}
.rk{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--s2);font-weight:850;font-size:13px}
.rk.r1{background:#ffd21f;color:#111}.rk.r2{background:#c9cdd5;color:#111}.rk.r3{background:#d08a4c;color:#111}
.tn{font-weight:750}.tc{font-size:11.5px;color:var(--mut);margin-top:1px}
.tp{font-weight:900;font-size:17px}
.tag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:99px;background:var(--s2);border:1px solid var(--line);font-size:10.5px;font-weight:800;color:var(--mut);vertical-align:1px}
.catsec h3{display:flex;align-items:center;gap:8px;font-size:15px}
.catsec h3::before{content:"";width:12px;height:12px;border-radius:50%;background:radial-gradient(circle,var(--y) 0 30%,var(--r) 31% 55%,var(--b) 56% 80%,#fff 81%);flex:none}

/* Listas */
.li{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:850;font-size:14px;color:#111}
.lt{flex:1;min-width:0}.lt b{display:block;overflow-wrap:anywhere}.lt span{font-size:12px;color:var(--mut)}
.mini-btn{width:38px;height:38px;border-radius:11px;background:var(--s2);border:1px solid var(--line);display:grid;place-items:center;font-size:15px;color:var(--mut);flex:none}
.jc .top{display:flex;align-items:flex-start;gap:10px}
.jc .top>div{flex:1;min-width:0}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;background:var(--y);color:#111;font-size:11px;font-weight:850}
.jc .meta{font-size:12.5px;color:var(--mut);margin-top:3px}
.jc .lead{margin-top:10px;font-size:13.5px}
.jc .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}

/* Formularios */
.fld{display:block;margin-top:12px}
.fld>span{display:block;font-size:11.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.in{width:100%;min-height:48px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--s2);font-size:16px;-webkit-appearance:none;appearance:none}
select.in{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
textarea.in{min-height:96px;resize:vertical;font-size:14px;font-family:ui-monospace,Menlo,Consolas,monospace}
.segr{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:4px}
.segr label{position:relative}
.segr input{position:absolute;opacity:0;pointer-events:none}
.segr span{display:block;text-align:center;padding:10px 4px;border-radius:9px;font-weight:750;font-size:14px;color:var(--mut)}
.segr input:checked+span{background:var(--prim);color:var(--primInk)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:6px;margin-bottom:8px}
.chips button{padding:8px 16px;border-radius:99px;background:var(--s2);border:1px solid var(--line);font-weight:800}
.chips button.on{background:var(--prim);color:var(--primInk);border-color:transparent}
.sw{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.sw div{flex:1}.sw small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.sw input{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:99px;background:var(--s3);position:relative;flex:none;transition:background .2s;cursor:pointer}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px #0005}
.sw input:checked{background:#1fa855}.sw input:checked::after{transform:translateX(20px)}

/* Hojas (ventanas) */
.sheetwrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:#000b;opacity:0;transition:opacity .2s}
.sheet{position:relative;width:100%;max-width:640px;max-height:92vh;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--s1);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:6px 16px calc(22px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.open .scrim{opacity:1}.open .sheet{transform:none}
.grab{width:42px;height:5px;border-radius:9px;background:var(--s3);margin:6px auto 12px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.x{width:38px;height:38px;border-radius:50%;background:var(--s2);font-size:18px;color:var(--mut);flex:none}
.sheet h4{margin:20px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut)}

/* Estadísticas */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kpi{background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.kpi b{display:block;font-size:21px;font-weight:900;line-height:1.1}
.kpi span{font-size:11px;color:var(--mut);font-weight:650}
.dist{display:flex;height:22px;border-radius:8px;overflow:hidden;margin-top:8px;background:var(--s2)}
.dist i{display:block;height:100%}
.dlist{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.dlist div{text-align:center;font-size:12px;color:var(--mut)}
.dlist b{display:grid;place-items:center;height:34px;border-radius:50%;width:34px;margin:0 auto 4px;font-size:13px}
.chart{width:100%;height:auto;display:block;margin-top:6px}

/* Comparación */
.diff{border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:8px;background:var(--s2)}
.diff .dh{display:flex;justify-content:space-between;font-weight:800;font-size:14px}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.pairs button{border-radius:12px;padding:8px;border:2px solid var(--line);background:var(--s1);text-align:left}
.pairs button small{display:block;font-size:11px;color:var(--mut);font-weight:700;margin-bottom:5px}
.pairs .dots{display:flex;align-items:center;gap:5px;font-weight:850}
.dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:850}
.dot.e{border:2px dashed var(--s3);color:var(--mut)}
.okbox{text-align:center;padding:20px 10px}
.okbox .big{font-size:54px}
.note{font-size:12.5px;color:var(--mut);background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;line-height:1.45}
.preview{white-space:pre-wrap;font-size:13px;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:12px;max-height:220px;overflow:auto;line-height:1.45;overflow-wrap:anywhere}
.imgprev{width:100%;border-radius:12px;border:1px solid var(--line);margin-top:8px}
.install{display:flex;gap:12px;align-items:center}
.install img{width:52px;height:52px;border-radius:12px;flex:none}

.lhead{display:grid;grid-template-columns:1fr 48px 48px;gap:8px}.lhead .iconbtn{width:48px;height:48px;font-size:18px}
.lhead select{font-weight:800;font-size:17px}
.rstrip{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
.rs{background:var(--s1);border:1px dashed var(--s3);border-radius:12px;padding:6px 2px;text-align:center;line-height:1.15}
.rs b{display:block;font-size:16px;font-weight:900}.rs span{display:block;font-size:10.5px;color:var(--mut);font-weight:700}.rs i{display:block;font-style:normal;font-size:9.5px;font-weight:800;color:var(--mut);margin-top:2px;text-transform:uppercase}
.rs.app{border:1px solid var(--y)}.rs.app i{color:var(--y)}.rs.excel,.rs.imp{border:1px solid var(--b)}.rs.excel i,.rs.imp i{color:var(--b)}
[data-theme=light] .rs.app i{color:#a37f00}
.scs{display:flex;gap:3px;margin-top:4px}
.sc{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:10.5px;font-weight:850;flex:none}
.sc.s5{background:var(--y);color:#111}.sc.s4{background:var(--r);color:#fff}.sc.s3{background:var(--b);color:#fff}.sc.s2{background:#0a0a0a;color:#fff;box-shadow:inset 0 0 0 1.5px #5a5f6a}.sc.s1{background:var(--w);color:#111;box-shadow:inset 0 0 0 1.5px #c9c8bf}.sc.s0{border:1.5px dashed var(--s3);color:var(--mut)}
.sc.drop{opacity:.35;position:relative}.sc.drop::after{content:"";position:absolute;left:-2px;right:-2px;top:50%;height:2px;background:var(--ink);transform:rotate(-35deg)}
.rt tr.me td{background:#ffd21f1f}.rt tr[data-person]{cursor:pointer}
.metag{background:var(--y);color:#111;border-color:var(--y)}
.pchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pchips button{padding:8px 12px;border-radius:99px;background:var(--s1);border:1px solid var(--line);font-weight:750;font-size:13px;color:var(--mut)}
.pchips button.on{background:var(--s2);color:var(--ink);border-color:var(--s3)}
.pchips i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px;box-shadow:0 0 0 1.5px var(--s1)}
.legend.lg{margin-top:4px}.legend.lg i{border-radius:50%}
.seg.sm button{padding:8px 4px;font-size:13px}
.notebar{display:block;width:100%;text-align:left;margin-top:10px;padding:11px 14px;border-radius:14px;background:var(--s1);border:1px dashed var(--s3);font-size:14px;line-height:1.35}
.lockn{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-color:var(--y)}.lockn .btn{margin-left:auto}
.recb{display:inline-block;margin-top:5px;padding:2px 9px;border-radius:99px;background:var(--y);color:#111;font-size:11px;font-weight:850;animation:fade .4s both}
.in.mv{width:auto;flex:none;min-height:40px;padding:6px 30px 6px 10px;font-size:14px;background-position:calc(100% - 15px) 17px,calc(100% - 10px) 17px}
.chk{width:22px;height:22px;flex:none;accent-color:#ffd21f}
.stickyb{position:sticky;bottom:0;margin-top:12px;box-shadow:0 -8px 20px var(--s1)}
#printArea{display:none}
@media print{html,body{background:#fff!important;color:#000!important;padding:0!important;min-height:0}body>*:not(#printArea){display:none!important}
#printArea{display:block!important;font-family:Arial,Helvetica,sans-serif;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.ph{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;border-bottom:2px solid #000;padding-bottom:4px}
.pt{width:100%;border-collapse:collapse;font-size:10px;table-layout:fixed}.pt th,.pt td{border:1px solid #555;text-align:center;padding:1px 2px;height:5.3mm;overflow:hidden}
.pt th{background:#eee;font-size:9.5px}.pt th small{font-weight:400;font-size:8px}.pt .dn{font-weight:700;background:#f3f3f3;width:12mm}.pt .dn small{font-weight:400;font-size:7px}
.pt .tt{font-weight:700;background:#fafafa}.pt .ac2{color:#555}.pt .big{font-size:14px;font-weight:700}.pt .sig td{height:11mm}.pf{font-size:10px;margin-top:5px}}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:80;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.22s;max-width:90vw;text-align:center;box-shadow:0 8px 24px #0006}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:600px){.pad .sb{height:64px}.kpis{grid-template-columns:repeat(4,1fr)}}
@media (max-width:360px){.slot{width:48px;height:48px}.sb{height:54px;font-size:20px}.tnum b{font-size:28px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<header class="appbar" id="appbar">
  <svg class="rings" viewBox="0 0 200 200" aria-hidden="true"><g fill="none" stroke-width="9"><circle cx="100" cy="100" r="92" stroke="#f7f7f2"/><circle cx="100" cy="100" r="74" stroke="#5a5f6a"/><circle cx="100" cy="100" r="56" stroke="#1f7fe0"/><circle cx="100" cy="100" r="38" stroke="#e3262e"/><circle cx="100" cy="100" r="20" stroke="#ffd21f"/></g></svg>
  <div class="in">
    <svg class="logo" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="49" fill="#f7f7f2"/><circle cx="50" cy="50" r="39" fill="#111"/><circle cx="50" cy="50" r="29.5" fill="#1f7fe0"/><circle cx="50" cy="50" r="20" fill="#e3262e"/><circle cx="50" cy="50" r="10.5" fill="#ffd21f"/></svg>
    <div class="ttl"><h1>Recorrido 3D</h1><p id="sub"></p></div>
    <button class="iconbtn" data-act="settings" aria-label="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
  </div>
</header>
<main id="main"></main>
<nav class="tabs" id="tabs"><div class="in">
  <button data-tab="score"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9.5"/><circle cx="12" cy="12" r="5.5"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg><span>Puntuar</span></button>
  <button data-tab="rank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM7 6H4v1.5A3.5 3.5 0 0 0 7.5 11M17 6h3v1.5a3.5 3.5 0 0 1-3.5 3.5"/></svg><span>Clasificación</span></button>
  <button data-tab="liga"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M6.5 15.5l4-5 3.5 3 5.5-7"/><circle cx="19.5" cy="6.5" r="1.3" fill="currentColor"/></svg><span>Liga</span></button>
  <button data-tab="archers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Tiradores</span></button>
  <button data-tab="jornadas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4.5" width="18" height="17" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg><span>Jornadas</span></button>
</div></nav>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(()=>{'use strict';
const KEY='recorrido3d_v1', APPVER='1.3.0';
const VALUES=[11,10,8,5,0];
const ENC={11:'E',10:'T',8:'8',5:'5',0:'0'}, DEC={E:11,T:10,'8':8,'5':5,'0':0};
const OLD_MODS=['Compuesto','Arco desnudo','Instintivo','Longbow','Tradicional','Recurvo'],OLD_AGES=['Infantil','Cadete','Júnior','Sénior','Veterano'];
const DEF_MODS=['Compuesto','Arco desnudo','Recurvado instintivo','Arco recto','ASA','ACA'];
const DEF_AGES=['Sénior','Júnior','Infantil'];
const SEXES=['Masculino','Femenino'];
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(crypto.randomUUID?crypto.randomUUID().replace(/-/g,''):Date.now().toString(36)+Math.random().toString(36).slice(2)).slice(0,12);
const ok=v=>VALUES.includes(v);
const nrm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtDate=iso=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||'');return m?`${m[3]}/${m[2]}/${m[1]}`:(iso||'')};
const isTouch=matchMedia('(pointer:coarse)').matches;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;

/* ---------- Datos ---------- */
function clampN(n){n=parseInt(n,10);return n>=1&&n<=99?n:24}
function sortPair(s){const v=(s||[]).filter(ok).sort((a,b)=>b-a);return [v[0]??null,v[1]??null]}
function fixA(a,n){return {id:String(a.id||uid()),name:String(a.name||'Tirador').slice(0,70),mod:String(a.mod||''),sex:String(a.sex||''),age:String(a.age||''),club:String(a.club||''),lic:String(a.lic||''),patrol:String(a.patrol??''),own:a.own!==false,
  scores:Array.from({length:n},(_,i)=>{const s=a.scores?.[i]||[];return sortPair([s[0],s[1]])})}}
function fixJ(j){j.id=String(j.id||uid());j.name=String(j.name||'Jornada');j.date=j.date||today();j.n=clampN(j.n);j.patrol=String(j.patrol??'');j.cur=Math.min(j.n,Math.max(1,parseInt(j.cur,10)||1));j.archers=(j.archers||[]).map(a=>fixA(a,j.n));j.created=j.created||Date.now();j.liga=typeof j.liga==='string'?j.liga:'';j.notes=j.notes&&typeof j.notes==='object'?j.notes:{};j.closed=!!j.closed;j.round=Math.min(6,Math.max(1,parseInt(j.round,10)||1));return j}
function load(){let d=null;try{d=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
  if(!d||!Array.isArray(d.jornadas))d={jornadas:[],activeId:null,settings:{}};
  d.settings=Object.assign({theme:'dark',vibrate:true,wake:true,advance:true,scorer:'',me:'Fernando Dapica',mods:DEF_MODS.slice(),ages:DEF_AGES.slice(),last:{}},d.settings||{});
  if(JSON.stringify(d.settings.mods)===JSON.stringify(OLD_MODS))d.settings.mods=DEF_MODS.slice();
  if(JSON.stringify(d.settings.ages)===JSON.stringify(OLD_AGES))d.settings.ages=DEF_AGES.slice();
  d.ligas=Array.isArray(d.ligas)?d.ligas.filter(l=>l&&/^[AC]\d{4}$/.test(l.k)).map(l=>({k:l.k,manual:l.manual&&typeof l.manual==='object'?l.manual:{},excel:l.excel&&typeof l.excel==='object'?l.excel:{}})):[];
  d.jornadas=d.jornadas.map(fixJ);
  d.socios=Array.isArray(d.socios)?d.socios.filter(x=>x&&x.name).map(fixS):[];
  if(!d.jornadas.some(j=>j.id===d.activeId))d.activeId=d.jornadas[0]?.id||null;
  return d}
let db=load();
function save(){try{const j=J();if(j)j.updated=Date.now();localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('⚠️ No se pudo guardar en el móvil')}}
const J=()=>db.jornadas.find(j=>j.id===db.activeId)||null;
const ownA=j=>j.archers.filter(a=>a.own);

const pts=s=>(s[0]??0)+(s[1]??0);
const full=s=>s[0]!=null&&s[1]!=null;
const lim=(a,u)=>u?a.scores.slice(0,u):a.scores;
const tot=(a,u)=>lim(a,u).reduce((t,s)=>t+pts(s),0);
const nArrows=a=>a.scores.reduce((t,s)=>t+(s[0]!=null)+(s[1]!=null),0);
const cnt=(a,v,u)=>lim(a,u).reduce((t,s)=>t+(s[0]===v)+(s[1]===v),0);
const doneT=(a,u)=>lim(a,u).filter(full).length;
const sexShort=s=>s==='Masculino'?'Masc.':s==='Femenino'?'Fem.':s;
const catOf=a=>[a.mod,sexShort(a.sex),a.age].filter(Boolean).join(' · ')||'Sin categoría';
function cmp(a,b,u){return tot(b,u)-tot(a,u)||cnt(b,11,u)-cnt(a,11,u)||cnt(b,10,u)-cnt(a,10,u)}
function ranked(list,u){const s=[...list].sort((a,b)=>cmp(a,b,u)||a.name.localeCompare(b.name,'es'));let pos=0;return s.map((a,i)=>{if(i===0||cmp(s[i-1],a,u)!==0)pos=i+1;return {a,pos}})}
function groups(list){const m=new Map();list.forEach(a=>{const k=catOf(a);if(!m.has(k))m.set(k,[]);m.get(k).push(a)});const S=db.settings,ix=(arr,v)=>{const i=arr.indexOf(v);return i<0?99:i};
  return [...m.entries()].sort((x,y)=>{const a=x[1][0],b=y[1][0];return ix(S.mods,a.mod)-ix(S.mods,b.mod)||ix(SEXES,a.sex)-ix(SEXES,b.sex)||ix(S.ages,a.age)-ix(S.ages,b.age)||x[0].localeCompare(y[0],'es')})}
const avColor=a=>({Compuesto:'#ffd21f','Arco desnudo':'#e3262e','Recurvado instintivo':'#1f7fe0',Instintivo:'#1f7fe0','Arco recto':'#f7f7f2',Longbow:'#f7f7f2',Tradicional:'#c9cdd5',Recurvo:'#d08a4c',ASA:'#c9cdd5',ACA:'#d08a4c'}[a.mod]||'#9aa0aa');
const initials=n=>n.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();

/* ---------- Estado de interfaz ---------- */
let view=J()?'score':'jornadas', mapOpen=false, editSlot=null, rankMode='general', rankUpTo=0, undo=[], deferredPrompt=null;
const upTo=j=>(rankUpTo>0&&rankUpTo<j.n)?rankUpTo:0;

/* ---------- Utilidades UI ---------- */
function toast(m,ms=2300){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),ms)}
function buzz(p){if(db.settings.vibrate&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}}
function sheet(html,onMount){closeSheet(true);const w=document.createElement('div');w.className='sheetwrap';
  w.innerHTML=`<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  document.body.appendChild(w);document.body.classList.add('noscroll');requestAnimationFrame(()=>requestAnimationFrame(()=>w.classList.add('open')));
  w.addEventListener('click',e=>{if(e.target.closest('[data-close]'))closeSheet()});
  const s=$('.sheet',w);onMount&&onMount(s);return s}
function closeSheet(instant){$$('.sheetwrap:not(.closing)').forEach(w=>{w.classList.add('closing');w.classList.remove('open');setTimeout(()=>w.remove(),instant?0:240)});document.body.classList.remove('noscroll')}
const shead=t=>`<div class="shead"><h2>${t}</h2><button class="x" data-close aria-label="Cerrar">✕</button></div>`;
function ask(msg,okText='Aceptar',danger=false){return new Promise(res=>{let done=false;const s=sheet(`${shead('¿Seguro?')}<p class="mut" style="font-size:15px">${msg}</p><div class="grid2" style="margin-top:16px"><button class="btn" data-no>Cancelar</button><button class="btn ${danger?'danger':'prim'}" data-yes>${okText}</button></div>`);
  s.addEventListener('click',e=>{if(e.target.closest('[data-yes]')){done=true;closeSheet();res(true)}else if(e.target.closest('[data-no]')){done=true;closeSheet();res(false)}});
  const w=s.parentElement;new MutationObserver((_,o)=>{if(!document.body.contains(w)){o.disconnect();if(!done)res(false)}}).observe(document.body,{childList:true})})}
function empty(title,text,btn=''){return `<div class="card empty">${bigTarget()}<b>${title}</b><div class="mut">${text}</div>${btn}</div>`}
function bigTarget(){return `<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="48" fill="#f7f7f2"/><circle cx="50" cy="50" r="38.5" fill="#111" stroke="#444" stroke-width="1"/><circle cx="50" cy="50" r="29" fill="#1f7fe0"/><circle cx="50" cy="50" r="19.5" fill="#e3262e"/><circle cx="50" cy="50" r="10" fill="#ffd21f"/><circle cx="50" cy="50" r="3.5" fill="none" stroke="#a57f00" stroke-width="1"/></svg>`}
const optList=(arr,sel)=>`<option value="">— Elegir —</option>`+[...new Set([...arr,...(sel&&!arr.includes(sel)?[sel]:[])])].map(v=>`<option ${v===sel?'selected':''}>${esc(v)}</option>`).join('');

function applyTheme(){const t=db.settings.theme;const dark=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=dark?'dark':'light';$('meta[name=theme-color]').content=dark?'#111316':'#ffffff'}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',applyTheme);
function setAbh(){document.documentElement.style.setProperty('--abh',$('#appbar').offsetHeight+'px')}

/* ---------- Pantalla siempre encendida ---------- */
let wl=null;
async function wake(){try{const want=view==='score'&&db.settings.wake&&document.visibilityState==='visible'&&!!J();
  if(want&&!wl&&'wakeLock' in navigator){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}
  else if(!want&&wl){await wl.release();wl=null}}catch(e){}}
document.addEventListener('visibilitychange',wake);

/* ---------- Render ---------- */
function render(){const j=J();
  $('#sub').textContent=j?`${j.name} · ${j.n} dianas${j.patrol?' · Patrulla '+j.patrol:''}`:'Crea una jornada para empezar';
  $$('#tabs [data-tab]').forEach(b=>{b.classList.toggle('on',b.dataset.tab===view);b.setAttribute('aria-current',b.dataset.tab===view?'page':'false')});
  let h;
  if(view==='jornadas')h=vJornadas();
  else if(view==='liga')h=vLiga();
  else if(!j)h=empty('No hay ninguna jornada activa','Crea una jornada nueva o importa la patrulla que te ha enviado el otro anotador.','<div class="stack" style="margin-top:16px"><button class="btn prim" data-act="newJ">＋ Nueva jornada</button><button class="btn" data-act="import">📥 Importar patrulla de WhatsApp</button></div>');
  else h={score:vScore,rank:vRank,archers:vArchers}[view](j);
  $('#main').innerHTML=h;wake()}
function go(v){view=v;editSlot=null;render();scrollTo({top:0})}

/* ===== PUNTUAR ===== */
function vScore(j){const own=ownA(j);
  if(!own.length)return empty('Añade los tiradores de tu patrulla','Después podrás anotar sus dos flechas en cada diana.','<button class="btn prim" data-tab="archers">Añadir tiradores</button>');
  const i=j.cur-1,allDone=own.every(a=>full(a.scores[i]));
  const complete=Array.from({length:j.n},(_,k)=>own.every(a=>full(a.scores[k]))).filter(Boolean).length;
  return `<div class="tbar">
    <button class="nav" data-act="prev" ${j.cur<=1?'disabled':''} aria-label="Diana anterior">‹</button>
    <button class="tnum" data-act="map" aria-expanded="${mapOpen}" aria-label="Diana ${j.cur} de ${j.n}. Mostrar mapa de dianas"><small>DIANA</small><b>${j.cur}</b><span>de ${j.n} ${mapOpen?'▴':'▾'}</span></button>
    <button class="nav" data-act="next" ${j.cur>=j.n?'disabled':''} aria-label="Diana siguiente">›</button>
  </div>
  <div class="prog" title="${complete} de ${j.n} dianas completas"><i style="width:${complete/j.n*100}%"></i></div>
  ${mapOpen?mapHtml(j):''}
  ${j.closed?'<div class="note lockn">🔒 <b>Tirada cerrada y validada.</b> Las puntuaciones están bloqueadas. <button class="btn sm" data-act="reopenJ">Reabrir</button></div>':''}
  ${noteBar(j)}
  ${own.map(a=>cardHtml(a,i)).join('')}
  ${j.closed?'':`<button class="btn wide" style="margin-top:14px;color:var(--mut)" data-act="clearT">Borrar puntuaciones de la diana ${j.cur}</button>`}
  ${allDone?`<div class="nextbar"><span>✓ Diana ${j.cur} completa</span><button data-act="${j.cur<j.n?'next':'gorank'}">${j.cur<j.n?`Diana ${j.cur+1} ›`:'Ver clasificación ›'}</button></div>`:''}
  ${undo.length&&!j.closed?`<button class="fab ${allDone?'up':''}" data-act="undo">↶ Deshacer</button>`:''}`}
function mapHtml(j){const own=ownA(j);
  return `<div class="map">${Array.from({length:j.n},(_,i)=>{const c=own.filter(a=>full(a.scores[i])).length,p=own.some(a=>a.scores[i][0]!=null);const st=c===own.length?'ok':p?'part':'';

function pushUndo(items){const j=J();undo.push({j:j.id,t:j.cur,items});if(undo.length>60)undo.shift()}
function setScore(aid,v){const j=J(),a=j.archers.find(x=>x.id===aid);if(!a)return;if(j.closed){closedMsg();return}const wasAll=doneT(a)===j.n;const i=j.cur-1,prev=a.scores[i].slice(),s=prev.slice(),was=full(prev);
  if(editSlot&&editSlot.aid===aid){s[editSlot.slot]=v;editSlot=null}
  else if(s[0]==null)s[0]=v;else if(s[1]==null)s[1]=v;
  else{buzz([30,40,30]);toast('Ya tiene 2 flechas. Toca una flecha para corregirla');const el=$(`.ac[data-aid="${CSS.escape(aid)}"]`);el&&(el.classList.remove('shake'),void el.offsetWidth,el.classList.add('shake'));return}
  const ns=sortPair(s);if(ns[0]===prev[0]&&ns[1]===prev[1]){render();return}
  pushUndo([{aid,i,prev}]);a.scores[i]=ns;buzz(14);save();render();
  if(!wasAll&&doneT(a)===j.n){const r=recordsHit(j,a);if(r.length){toast(`🏆 ¡Nuevo récord personal de ${a.name}! ${r.join(' · ')}`,4500);buzz([40,60,40,60,90])}}
  if(!was&&full(ns))advanceFrom(aid)}
function slotTap(aid,k){if(J().closed){closedMsg();return}const a=J().archers.find(x=>x.id===aid);if(!a||a.scores[J().cur-1][k]==null)return;
  editSlot=(editSlot&&editSlot.aid===aid&&editSlot.slot===k)?null:{aid,slot:k};render()}
function advanceFrom(aid){const j=J(),own=ownA(j),i=j.cur-1,idx=own.findIndex(a=>a.id===aid);
  if(own.every(a=>full(a.scores[i]))){buzz([20,60,30]);return}
  if(!db.settings.advance)return;
  const nx=[...own.slice(idx+1),...own.slice(0,idx)].find(a=>!full(a.scores[i]));
  if(nx){const el=$(`.ac[data-aid="${CSS.escape(nx.id)}"]`);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),950)}}}
function clearArcher(aid){const j=J(),a=j.archers.find(x=>x.id===aid),i=j.cur-1;if(!a)return;if(j.closed){closedMsg();return}pushUndo([{aid,i,prev:a.scores[i].slice()}]);a.scores[i]=[null,null];editSlot=null;save();render();toast('Flechas borradas · puedes deshacer')}
async function clearT(){const j=J();if(j.closed){closedMsg();return}if(!(await ask(`Se borrarán las flechas de todos los tiradores de tu patrulla en la diana ${j.cur}.`,'Borrar',true)))return;
  const i=j.cur-1;pushUndo(ownA(j).map(a=>({aid:a.id,i,prev:a.scores[i].slice()})));ownA(j).forEach(a=>a.scores[i]=[null,null]);save();render();toast('Diana borrada · puedes deshacer')}
function doUndo(){const u=undo.pop();if(!u)return;const j=db.jornadas.find(x=>x.id===u.j);if(!j){render();return}if(j.closed){undo.push(u);closedMsg();return}
  u.items.forEach(({aid,i,prev})=>{const a=j.archers.find(x=>x.id===aid);if(a&&a.scores[i])a.scores[i]=prev});
  if(j.id===db.activeId)j.cur=u.t;editSlot=null;save();render();buzz(10);toast('Deshecho')}
function goT(t){const j=J();t=Math.min(j.n,Math.max(1,t));if(t===j.cur)return;j.cur=t;editSlot=null;save();render();scrollTo({top:0,behavior:'smooth'})}

function statSheet(id){const j=J(),a=j?.archers.find(x=>x.id===id);if(!a)return;
  const n=nArrows(a),done=doneT(a),T=tot(a),pg=ranked(j.archers).find(x=>x.a.id===id).pos,pc=ranked(j.archers.filter(x=>catOf(x)===catOf(a))).find(x=>x.a.id===id).pos;
  const fullS=a.scores.map((s,i)=>({s,i})).filter(x=>full(x.s));
  const avg=done?fullS.reduce((t,x)=>t+pts(x.s),0)/done:0;
  let best=null;a.scores.forEach((s,i)=>{if(s[0]!=null&&(!best||pts(s)>best.p))best={p:pts(s),i}});

  const W=340,H=150,bw=W/j.n,cols=p=>p>=21?'#ffd21f':p>=16?'#e3262e':p>=10?'#1f7fe0':p>0?'#8a8f99':'#5a5f6a';

   <div class="kpis"><div class="kpi"><b>${T}</b><span>Puntos</span></div><div class="kpi"><b>${pg}º</b><span>General</span></div><div class="kpi"><b>${pc}º</b><span>Categoría</span></div>
   <div class="kpi"><b>${avg.toFixed(1)}</b><span>Media / diana</span></div><div class="kpi"><b>${pct(11)}%</b><span>de 11</span></div><div class="kpi"><b>${pct(0)}%</b><span>Fallos (0)</span></div>
   <div class="kpi"><b>${best?best.p:'–'}</b><span>Mejor diana${best?' (nº '+(best.i+1)+')':''}</span></div><div class="kpi"><b>${done}/${j.n}</b><span>Dianas</span></div></div>

   <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Puntos por diana">${[22,11].map(v=>`<line x1="0" x2="${W}" y1="${H-20-v/22*(H-34)}" y2="${H-20-v/22*(H-34)}" stroke="var(--line)"/><text x="${W}" y="${H-23-v/22*(H-34)}" text-anchor="end" font-size="9" fill="var(--mut)">${v}</text>`).join('')}${bars}${done?`<line x1="0" x2="${W}" y1="${ay}" y2="${ay}" stroke="var(--ink)" stroke-dasharray="4 4" opacity=".6"/>`:''}${ticks}</svg>
   <p class="mut" style="font-size:12px;margin-top:6px">Línea discontinua: media por diana.</p>${recordsHtml(a)}${animalHtml(a)}

function rankText(j){const u=upTo(j);let t=`🎯 *${j.name}*\n📅 ${fmtDate(j.date)} · ${j.n} dianas${u?`\n📍 Tras la diana ${u}`:''}\n`;

function b64e(s){const b=new TextEncoder().encode(s);let bin='';for(let i=0;i<b.length;i+=8192)bin+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(bin)}
function b64d(s){const bin=atob(s);return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)))}
function makeCode(j){const o={v:1,j:{i:j.id,n:j.name,d:j.date,t:j.n,l:j.liga||'',r:j.round||1},p:j.patrol||'',s:db.settings.scorer||'',
  a:ownA(j).map(a=>[a.id,a.name,a.mod,a.sex,a.age,a.club,a.scores.map(s=>(s[0]==null?'-':ENC[s[0]])+(s[1]==null?'-':ENC[s[1]])).join('')])};
  return 'R3D:'+b64e(JSON.stringify(o))}
function readCode(txt){const m=String(txt).replace(/\s+/g,'').match(/R3D:([A-Za-z0-9+/=]+)/);if(!m)throw new Error('No encuentro ningún código de Recorrido 3D en el texto pegado.');
  let o;try{o=JSON.parse(b64d(m[1]))}catch(e){throw new Error('El código está incompleto o dañado. Copia el mensaje entero otra vez.')}
  if(!o||o.v!==1||!Array.isArray(o.a))throw new Error('Este código no es de una versión compatible.');
  const n=clampN(o.j?.t),p=String(o.p||'');
  return {liga:/^[AC]\d{4}$/.test(o.j?.l||'')?o.j.l:'',round:parseInt(o.j?.r,10)||1,jid:String(o.j?.i||''),name:String(o.j?.n||'Jornada'),date:String(o.j?.d||today()),n,patrol:p,scorer:String(o.s||''),
    archers:o.a.map(r=>{const str=String(r[6]||'');return fixA({id:r[0],name:r[1],mod:r[2],sex:r[3],age:r[4],club:r[5],patrol:p,own:false,
      scores:Array.from({length:n},(_,i)=>[DEC[str[i*2]],DEC[str[i*2+1]]])},n)})}}

let pend=null;
function importSheet(){pend=null;sheet(`${shead('Importar patrulla o liga')}<p class="mut" style="margin:0">Pega el mensaje recibido por WhatsApp (de una patrulla o de una liga). Puedes pegarlo entero: la app encuentra el código sola.</p>

        <div class="mut" style="margin-top:6px">${p.archers.map(a=>esc(a.name)+' ('+tot(a)+')').join(', ')}</div></div>
        <h4>¿Qué quieres hacer?</h4><div class="stack">
        ${j&&ownA(j).length?`<button class="btn ${same?'prim':''} wide opt" data-s="cmp">✔︎ Comprobar con mis puntuaciones<small>Soy el otro anotador de esta patrulla</small></button>`:''}
        ${j?`<button class="btn ${!same&&j?'prim':''} wide opt" data-s="merge">🏆 Añadir a la clasificación de “${esc(j.name)}”<small>Juntar patrullas (organizador)</small></button>`:''}
        <button class="btn wide opt" data-s="new">＋ Crear jornada con estos tiradores<small>Para empezar a anotar la misma patrulla</small></button></div>
        ${same?'<div class="note">Parece tu misma patrulla: lo normal es <b>comprobar</b>, no añadirla a la clasificación.</div>':''}

      res.scrollIntoView({behavior:'smooth',block:'start'})}
    catch(e){pend=null;res.innerHTML=`<div class="note" style="color:var(--r)">${esc(e.message)}</div>`}};
  $('input[type=file]',s).addEventListener('change',async e=>{const f=e.target.files[0];if(f){ta.value=await f.text();read()}});

    else if(k==='liga'&&pend?.liga)importLiga(pend.liga);

function mergeImport(p){const j=J();let add=0,upd=0,skip=0;
  p.archers.forEach(b=>{const own=j.archers.find(a=>a.own&&a.id===b.id);if(own){skip++;return}
    const k=j.archers.findIndex(a=>!a.own&&(a.id===b.id||(nrm(a.name)===nrm(b.name)&&a.patrol===b.patrol)));const nb=fixA({...b,own:false},j.n);
    if(k>=0){j.archers[k]=nb;upd++}else{j.archers.push(nb);add++}});
  save();closeSheet();view='rank';render();toast(`Patrulla importada: ${add} nuevos${upd?`, ${upd} actualizados`:''}${skip?`, ${skip} ya eran tuyos`:''}`)}
function newFromImport(p){const nj=fixJ({id:uid(),name:p.name,date:p.date,n:p.n,patrol:p.patrol,liga:p.liga,round:p.round,cur:1,archers:p.archers.map(a=>({...a,own:true,scores:[]}))});
  db.jornadas.push(nj);db.activeId=nj.id;undo=[];save();closeSheet();go('score');toast('Jornada creada con la misma patrulla')}
function compareSheet(p){const j=J();if(j.closed){closedMsg();return}const own=ownA(j);const pairs=[],missing=[],used=new Set();
  own.forEach(a=>{const b=p.archers.find(x=>x.id===a.id)||p.archers.find(x=>!used.has(x.id)&&nrm(x.name)===nrm(a.name));if(b){used.add(b.id);pairs.push([a,b])}else missing.push(a)});
  const extra=p.archers.filter(b=>!used.has(b.id));const kept=new Set();
  const dots=s=>[0,1].map(k=>s[k]==null?'<span class="dot e">–</span>':`<span class="dot v${s[k]}">${s[k]}</span>`).join('')+`<span style="margin-left:4px">= ${pts(s)}</span>`;
  const s=sheet('<div id="cmpbody"></div>',el=>{
    const draw=()=>{const diffs=[];pairs.forEach(([a,b])=>{for(let i=0;i<Math.min(j.n,p.n);i++){const x=a.scores[i],y=b.scores[i];if((x[0]!==y[0]||x[1]!==y[1])&&!kept.has(a.id+':'+i))diffs.push({a,b,i})}});
      $('#cmpbody',el).innerHTML=`${shead('Comprobación')}<div class="mut">Comparando tu patrulla con ${p.scorer?'<b>'+esc(p.scorer)+'</b>':'el otro anotador'} · ${pairs.length} tiradores emparejados.</div>
      ${!diffs.length&&!missing.length&&!extra.length?`<div class="okbox"><div class="big">✅</div><h2>¡Los datos coinciden!</h2><p class="mut">Las ${Math.min(j.n,p.n)} dianas de los ${pairs.length} tiradores son iguales en los dos móviles.</p></div>`:''}
      ${diffs.length?`<h4>${diffs.length} diferencia${diffs.length>1?'s':''}</h4><button class="btn sm" data-s="all" style="margin-bottom:4px">Aceptar todas las del otro anotador</button>`+diffs.map(d=>`<div class="diff"><div class="dh"><span>${esc(d.a.name)}</span><span>Diana ${d.i+1}</span></div>
        <div class="pairs"><button data-s="mine" data-k="${esc(d.a.id)}:${d.i}"><small>MÍA · dejar</small><span class="dots">${dots(d.a.scores[d.i])}</span></button><button data-s="theirs" data-k="${esc(d.a.id)}:${d.i}" data-b="${esc(d.b.id)}"><small>DEL OTRO · usar</small><span class="dots">${dots(d.b.scores[d.i])}</span></button></div></div>`).join(''):''}
      ${missing.length?`<div class="note">Solo están en tu móvil: ${missing.map(a=>esc(a.name)).join(', ')}</div>`:''}
      ${extra.length?`<div class="note">Solo están en el otro móvil: ${extra.map(a=>esc(a.name)).join(', ')}</div>`:''}
      <button class="btn prim wide" style="margin-top:16px" data-close>Hecho</button>`};
    draw();
    el.addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;
      const apply=(aid,i,bid)=>{const a=j.archers.find(x=>x.id===aid),o=p.archers.find(x=>x.id===bid);if(!a||!o)return null;const prev=a.scores[i].slice();a.scores[i]=o.scores[i].slice();return {aid,i,prev}};
      if(b.dataset.s==='mine'){kept.add(b.dataset.k);draw()}
      else if(b.dataset.s==='theirs'){const k=b.dataset.k,cut=k.lastIndexOf(':');const it=apply(k.slice(0,cut),+k.slice(cut+1),b.dataset.b);if(it)pushUndo([it]);save();draw();render()}
      else if(b.dataset.s==='all'){const items=[];pairs.forEach(([a,o])=>{for(let i=0;i<Math.min(j.n,p.n);i++){const x=a.scores[i],y=o.scores[i];if((x[0]!==y[0]||x[1]!==y[1])&&!kept.has(a.id+':'+i)){const it=apply(a.id,i,o.id);it&&items.push(it)}}});if(items.length)pushUndo(items);save();draw();render();toast(`${items.length} dianas corregidas`)}})});
  return s}

/* ---------- Imagen de la clasificación ---------- */
function rankBlob(j){const u=upTo(j);const gs=rankMode==='general'?[['Clasificación general',j.archers]]:groups(j.archers);
  const W=1080,P=64,RH=84;let H=300;gs.forEach(([,l])=>H+=96+l.length*RH);H+=90;
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');const F=(w,s)=>`${w} ${s}px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif`;
  const fit=(t,max)=>{if(x.measureText(t).width<=max)return t;while(t.length>1&&x.measureText(t+'…').width>max)t=t.slice(0,-1);return t+'…'};
  x.fillStyle='#0b0c0e';x.fillRect(0,0,W,H);
  [['#ffd21f',70],['#e3262e',140],['#1f7fe0',210],['#5a5f6a',280],['#f7f7f2',350]].forEach(([col,r])=>{x.beginPath();x.arc(W-30,110,r,0,Math.PI*2);x.strokeStyle=col;x.globalAlpha=.18;x.lineWidth=30;x.stroke()});x.globalAlpha=1;
  [['#f7f7f2',1],['#111',.8],['#1f7fe0',.6],['#e3262e',.4],['#ffd21f',.2]].forEach(([col,k])=>{x.beginPath();x.arc(P+52,124,52*k,0,Math.PI*2);x.fillStyle=col;x.fill()});
  x.textBaseline='middle';x.fillStyle='#fff';x.font=F(850,54);x.fillText(fit(j.name,W-P*2-140),P+130,104);
  x.fillStyle='#a3a8b1';x.font=F(500,30);x.fillText(`${fmtDate(j.date)} · ${u?'Tras la diana '+u+' de '+j.n:j.n+' dianas'} · ${j.archers.length} tiradores`,P+130,154);
  const rr=(X,Y,w,h,r)=>{x.beginPath();if(x.roundRect)x.roundRect(X,Y,w,h,r);else x.rect(X,Y,w,h)};
  let y=262;

const LMON={A:['Enero','Febrero','Marzo','Abril','Mayo','Junio'],C:['Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre']};
function ligaOf(date){const m=parseInt(String(date).slice(5,7),10)||1,y=parseInt(String(date).slice(0,4),10)||new Date().getFullYear();return {k:(m<=6?'A':'C')+y,r:m<=6?m:m-6}}

function ligaOpts(sel){const y=new Date().getFullYear(),set=new Set();[y-1,y,y+1].forEach(v=>{set.add('A'+v);set.add('C'+v)});ligaKeys().forEach(k=>set.add(k));if(sel)set.add(sel);
  return `<option value="">Sin liga (tirada suelta)</option>`+[...set].sort((a,b)=>ligaOrd(b)-ligaOrd(a)).map(k=>`<option value="${k}" ${k===sel?'selected':''}>${ligaName(k)}</option>`).join('')}

function ligaKeys(){const s=new Set(db.ligas.map(l=>l.k));db.jornadas.forEach(j=>{if(j.liga)s.add(j.liga)});return [...s].sort((a,b)=>ligaOrd(b)-ligaOrd(a))}
function getLiga(k,create){let l=db.ligas.find(x=>x.k===k);if(!l&&create){l={k,manual:{},excel:{}};db.ligas.push(l)}return l}
function scrRank(list){const by=new Map();list.forEach(x=>{if(!by.has(x.cat))by.set(x.cat,[]);by.get(x.cat).push(x)});
  by.forEach(arr=>{arr.sort((a,b)=>b.pts-a.pts||b.n11-a.n11||b.n10-a.n10);let pos=0;arr.forEach((x,i)=>{const p=arr[i-1];if(!p||p.pts!==x.pts||p.n11!==x.n11||p.n10!==x.n10)pos=i+1;x.scr=pos<=4?6-pos:1})})}
const manualRes=(man,src)=>({src,list:man.map(x=>({key:nrm(x[0]),name:String(x[0]),mod:x[1]||'',sex:x[2]||'',age:x[3]||'',cat:lcat(x[1],x[2],x[3]),pts:+x[4]||0,scr:+x[5]||0,n11:+x[6]||0,n10:+x[7]||0}))});
function roundRes(k,r){const lx=getLiga(k),mx=lx?.manual?.[r];if(lx?.excel?.[r]&&Array.isArray(mx)&&mx.length)return manualRes(mx,'excel');
  const js=db.jornadas.filter(j=>j.liga===k&&j.round===r);
  if(js.length){const m=new Map();js.forEach(j=>j.archers.forEach(a=>{const na=nArrows(a);if(!na)return;const key=nrm(a.name),o=m.get(key);if(o&&o._na>=na)return;
      m.set(key,{key,name:a.name,mod:a.mod,sex:a.sex,age:a.age,cat:lcat(a.mod,a.sex,a.age),pts:tot(a),n11:cnt(a,11),n10:cnt(a,10),_na:na})}));
    const list=[...m.values()];if(list.length){scrRank(list);return {src:'app',list}}}
  const man=getLiga(k)?.manual?.[r];
  if(Array.isArray(man)&&man.length)return manualRes(man,'imp');
  return null}
function ligaCalc(k){const rounds=[1,2,3,4,5,6].map(r=>roundRes(k,r)),held=rounds.filter(Boolean).length,pending=6-held,P=new Map();
  rounds.forEach((rr,ri)=>rr&&rr.list.forEach(x=>{let p=P.get(x.key);if(!p){p={key:x.key,rounds:Array(6).fill(null)};P.set(x.key,p)}Object.assign(p,{name:x.name,cat:x.cat,mod:x.mod,sex:x.sex,age:x.age});p.rounds[ri]=x}));
  const people=[...P.values()];
  people.forEach(p=>{p.att=p.rounds.filter(Boolean).length;p.drop=-1;
    if(held===6){let b=null;p.rounds.forEach((x,i)=>{const sc=x?x.scr:0,pt=x?x.pts:0;if(!b||sc<b.sc||(sc===b.sc&&pt<b.pt))b={i,sc,pt}});p.drop=b.i}
    p.scr=0;p.pts=0;p.n11=0;p.n10=0;p.rounds.forEach((x,i)=>{if(x&&i!==p.drop){p.scr+=x.scr;p.pts+=x.pts;p.n11+=x.n11;p.n10+=x.n10}});
    p.out=p.att+pending<4;p.avg=p.att?p.rounds.reduce((t,x)=>t+(x?x.pts:0),0)/p.att:0});
  const cats=new Map();people.forEach(p=>{if(!cats.has(p.cat))cats.set(p.cat,[]);cats.get(p.cat).push(p)});
  const S=db.settings,ix=(arr,v)=>{const i=arr.indexOf(v);return i<0?99:i};
  const cmpP=(a,b)=>(a.out-b.out)||b.scr-a.scr||b.pts-a.pts||b.n11-a.n11||b.n10-a.n10;
  const groups=[...cats.entries()].map(([c,l])=>{l.sort((a,b)=>cmpP(a,b)||a.name.localeCompare(b.name,'es'));let pos=0;l.forEach((p,i)=>{if(i===0||cmpP(l[i-1],p)!==0)pos=i+1;p.pos=pos});return [c,l]})
    .sort((x,y)=>{const a=x[1][0],b=y[1][0];return ix(S.mods,a.mod)-ix(S.mods,b.mod)||ix(S.ages,a.age||'Sénior')-ix(S.ages,b.age||'Sénior')||ix(SEXES,a.sex)-ix(SEXES,b.sex)||x[0].localeCompare(y[0],'es')});
  return {k,rounds,held,pending,people,groups}}

/* Gráfica de líneas (eje vertical ajustado a los valores para que se noten las diferencias) */
const PAL=['#e3262e','#1f7fe0','var(--ink)','#1fa855','#d08a4c','#b07cff','#3fd0d9','#ff7ab6'];
function lineChart(labels,series,{dec=0}={}){const vals=series.flatMap(s=>s.vals).filter(v=>v!=null);
  if(!vals.length)return '<div class="mut" style="text-align:center;padding:26px 10px">Sin datos todavía</div>';
  const W=360,H=240,L=40,R=18,T=26,B=30,n=labels.length;let mn=Math.min(...vals),mx=Math.max(...vals);
  if(mx-mn<20){const c=(mx+mn)/2;mn=c-10;mx=c+10}const pd=(mx-mn)*.2,span=mx-mn+2*pd;const st=[5,10,20,25,50,100,200,500].find(x=>span/x<=5)||1000;
  const lo=Math.max(0,Math.floor((mn-pd)/st)*st),hi=Math.ceil((mx+pd)/st)*st;
  const X=i=>n===1?(L+W-R)/2:L+i*(W-L-R)/(n-1),Y=v=>T+(hi-v)/(hi-lo)*(H-T-B),f=v=>dec?v.toFixed(dec):Math.round(v);
  let g='';for(let v=lo;v<=hi+.001;v+=st){const y=Y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+3.5}" text-anchor="end" font-size="10" fill="var(--mut)">${Math.round(v)}</text>`}
  labels.forEach((t,i)=>g+=`<text x="${X(i)}" y="${H-10}" text-anchor="middle" font-size="10.5" fill="var(--mut)" font-weight="700">${esc(t)}</text>`);
  const order=[...series].sort((a,b)=>(a.strong?1:0)-(b.strong?1:0));
  order.forEach(sr=>{let d='',prev=null;sr.vals.forEach((v,i)=>{if(v==null){prev=null;return}d+=(prev==null?'M':'L')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' ';prev=v});
    g+=`<path d="${d}" fill="none" stroke="${sr.color}" stroke-width="${sr.strong?3.5:2.2}" stroke-linejoin="round" stroke-linecap="round" ${sr.strong?'':'opacity=".9"'}/>`;
    let last=null;sr.vals.forEach((v,i)=>{if(v==null)return;const x=X(i),y=Y(v);
      g+=`<circle cx="${x}" cy="${y}" r="${sr.strong?5.5:3.8}" fill="var(--s1)" stroke="${sr.color}" stroke-width="${sr.strong?3:2.2}"><title>${esc(sr.name)}: ${f(v)}</title></circle>`;
      if(sr.strong||series.length===1){g+=`<text x="${x}" y="${y-11}" text-anchor="middle" font-size="11.5" font-weight="900" fill="var(--ink)">${f(v)}</text>`;
        if(last!=null){const dv=v-last;g+=`<text x="${x}" y="${y+20}" text-anchor="middle" font-size="10.5" font-weight="800" fill="${dv>0?'#1fa855':dv<0?'#e3262e':'var(--mut)'}">${dv>0?'▲ +':dv<0?'▼ ':'= '}${dv?f(dv):''}</text>`}}
      last=v})});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfica de evolución">${g}</svg>
   <div class="legend lg">${series.map(sr=>`<span><i style="background:${sr.color};border-color:${sr.color}"></i>${esc(sr.name)}${sr.strong?' ⭐':''}</span>`).join('')}</div>`}
const scChip=(x,drop)=>x?`<span class="sc s${Math.min(5,x.scr)} ${drop?'drop':''}" title="${x.pts} pts · SCR ${x.scr}">${x.scr}</span>`:`<span class="sc s0 ${drop?'drop':''}" title="No vino">·</span>`;

  <button class="btn prim wide" style="margin-top:14px" data-s="ok">🔒 Confirmamos los totales · Cerrar</button>`,s=>{

async function reopenJ(){const j=J();if(!(await ask('Se podrán volver a cambiar las puntuaciones de esta tirada.','Reabrir')))return;j.closed=false;save();render();toast('🔓 Tirada reabierta')}

/* ===== RÉCORDS PERSONALES ===== */
function tiradasOf(name){const key=nrm(name),out=[];
  db.jornadas.forEach(j=>j.archers.forEach(a=>{if(nrm(a.name)===key&&j.n>0&&doneT(a)===j.n)out.push({jid:j.id,date:j.date,created:j.created||0,n:j.n,pts:tot(a),n11:cnt(a,11),avg:tot(a)/j.n,label:fmtDate(j.date)})}));
  db.ligas.forEach(l=>Object.entries(l.manual||{}).forEach(([r,res])=>{if(!Array.isArray(res))return;res.forEach(x=>{if(nrm(x[0])===key&&+x[4]>0){const m=(l.k[0]==='A'?0:6)+(+r);
    out.push({date:`${l.k.slice(1)}-${String(m).padStart(2,'0')}-15`,created:0,n:24,pts:+x[4],n11:+x[6]||0,avg:(+x[4])/24,label:`${LMON[l.k[0]][r-1]} ${l.k.slice(1)}`})}})}));
  return out}
function recordsHit(j,a){if(!j||doneT(a)!==j.n)return [];const prev=tiradasOf(a.name).filter(t=>t.jid!==j.id&&(t.date<j.date||(t.date===j.date&&t.created<(j.created||0))));if(!prev.length)return [];
  const p=tot(a),n11=cnt(a,11),same=prev.filter(t=>t.n===j.n),out=[];
  if(same.length&&p>Math.max(...same.map(t=>t.pts)))out.push(`mejor tirada (${p})`);
  if(n11>Math.max(...prev.map(t=>t.n11)))out.push(`más 11 (${n11})`);
  if(!same.length&&p/j.n>Math.max(...prev.map(t=>t.avg)))out.push(`mejor media (${(p/j.n).toFixed(1)})`);
  return out}
function recordsHtml(a){const T=tiradasOf(a.name);if(!T.length)return '';const top=f=>[...T].sort((x,y)=>f(y)-f(x))[0],b=top(t=>t.pts),e=top(t=>t.n11),m=top(t=>t.avg);
  return `<h4>🏆 Récords personales · ${T.length} tirada${T.length===1?'':'s'}</h4><div class="kpis"><div class="kpi"><b>${b.pts}</b><span>Mejor tirada<br>${esc(b.label)}</span></div><div class="kpi"><b>${e.n11}</b><span>Más 11<br>${esc(e.label)}</span></div><div class="kpi"><b>${m.avg.toFixed(1)}</b><span>Mejor media<br>${esc(m.label)}</span></div></div>`}

function animalHtml(a){const key=nrm(a.name),m=new Map();
  db.jornadas.forEach(j=>{const b=j.archers.find(x=>nrm(x.name)===key);if(!b)return;Object.entries(j.notes||{}).forEach(([i,n])=>{const s=b.scores[+i];if(!n.an||!s||s[0]==null)return;
    const k=nrm(n.an),o=m.get(k)||{an:n.an,c:0,p:0,d:0,dn:0};o.c++;o.p+=pts(s);if(+n.d){o.d+=+n.d;o.dn++}m.set(k,o)})});
  if(!m.size)return '';const rows=[...m.values()].sort((x,y)=>x.p/x.c-y.p/y.c);
  return `<h4>🦌 Por animal</h4><table class="prog-t"><thead><tr><th>Animal</th><th>Dianas</th><th>Distancia</th><th>Media</th></tr></thead><tbody>${rows.map(o=>`<tr><td style="text-align:left">${esc(o.an)}</td><td>${o.c}</td><td>${o.dn?Math.round(o.d/o.dn)+' m':'–'}</td><td>${(o.p/o.c).toFixed(1)}</td></tr>`).join('')}</tbody></table><p class="mut" style="font-size:12px">De peor a mejor: arriba, los animales que más te cuestan.</p>`}

function printSheet(){sheet(`${shead('Hoja de puntuación')}<p class="mut" style="margin:0">Se abrirá la ventana de imprimir del móvil: elige <b>“Guardar como PDF”</b> o imprímela.</p>
  <div class="stack" style="margin-top:12px"><button class="btn prim wide opt" data-s="blank">🖨️ En blanco<small>Para rellenar a mano si falla el móvil</small></button><button class="btn wide opt" data-s="full">🖨️ Con las puntuaciones<small>Como comprobante de la tirada</small></button></div>`,s=>{
  s.addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;closeSheet();doPrint(b.dataset.s==='full')})})}
function doPrint(withScores){const j=J(),own=ownA(j);if(!own.length){toast('No hay tiradores en tu patrulla');return}
  const acc=own.map(()=>0);let rows='';
  for(let i=0;i<j.n;i++){const n=j.notes[i];rows+=`<tr><td class="dn">${i+1}${n&&n.an?`<br><small>${esc(n.an)}</small>`:''}</td>${own.map((a,k)=>{const s=a.scores[i],has=withScores&&s[0]!=null;if(has)acc[k]+=pts(s);
    return `<td>${has?s[0]:''}</td><td>${has&&s[1]!=null?s[1]:''}</td><td class="tt">${has?pts(s):''}</td><td class="ac2">${has?acc[k]:''}</td>`}).join('')}</tr>`}
  const html=`<div class="ph"><div><b>🎯 Recorrido 3D</b> · ${esc(j.name)}</div><div>${fmtDate(j.date)}${j.patrol?' · Patrulla '+esc(j.patrol):''}${j.liga?' · '+esc(ligaName(j.liga))+' · tirada '+j.round:''}</div></div>
  <table class="pt"><thead><tr><th rowspan="2">Diana</th>${own.map(a=>`<th colspan="4">${esc(a.name)}<br><small>${esc(catOf(a))}</small></th>`).join('')}</tr><tr>${own.map(()=>'<th>1ª</th><th>2ª</th><th>Pts</th><th>Acum.</th>').join('')}</tr></thead><tbody>${rows}</tbody>
  <tfoot><tr><td><b>Total</b></td>${own.map(a=>`<td colspan="4" class="big">${withScores?tot(a):''}</td>`).join('')}</tr><tr><td><b>11 / 10</b></td>${own.map(a=>`<td colspan="4">${withScores?`11×${cnt(a,11)} · 10×${cnt(a,10)}`:'11×____ · 10×____'}</td>`).join('')}</tr><tr class="sig"><td><b>Firma</b></td>${own.map(()=>'<td colspan="4"></td>').join('')}</tr></tfoot></table>
  <div class="pf">Valores: 11 · 10 · 8 · 5 · 0 — Anotador 1: ____________________ · Anotador 2: ____________________</div>`;
  let pa=$('#printArea');if(!pa){pa=document.createElement('div');pa.id='printArea';document.body.appendChild(pa)}pa.innerHTML=html;
  let ps=$('#pageStyle');if(!ps){ps=document.createElement('style');ps.id='pageStyle';document.head.appendChild(ps)}ps.textContent=`@page{size:A4 ${own.length>3?'landscape':'portrait'};margin:7mm}`;
  setTimeout(()=>window.print(),120)}

/* ===== DIPLOMA DEL PODIO ===== */
function diplomaBlob(k,cat){const Lg=ligaCalc(k),g=Lg.groups.find(x=>x[0]===cat),top=(g?g[1]:[]).filter(p=>!p.out).slice(0,3);
  const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d'),F=(w,s)=>`${w} ${s}px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif`;
  const fit=(t,max)=>{if(x.measureText(t).width<=max)return t;while(t.length>1&&x.measureText(t+'…').width>max)t=t.slice(0,-1);return t+'…'};
  x.fillStyle='#0b0c0e';x.fillRect(0,0,W,H);
  [['#f7f7f2',520],['#5a5f6a',420],['#1f7fe0',320],['#e3262e',220],['#ffd21f',120]].forEach(([col,r])=>{x.beginPath();x.arc(W/2,600,r,0,Math.PI*2);x.strokeStyle=col;x.globalAlpha=.11;x.lineWidth=60;x.stroke()});x.globalAlpha=1;
  x.strokeStyle='#ffd21f';x.lineWidth=6;x.strokeRect(30,30,W-60,H-60);x.strokeStyle='#ffd21f55';x.lineWidth=2;x.strokeRect(48,48,W-96,H-96);
  x.textAlign='center';x.textBaseline='middle';x.fillStyle='#ffd21f';x.font=F(800,34);x.fillText('LIGA '+ligaName(k).toUpperCase(),W/2,130);
  x.fillStyle='#fff';x.font=F(900,80);x.fillText(Lg.held===6?'CAMPEONES':'PODIO',W/2,215);
  x.fillStyle='#c9cdd5';x.font=F(700,36);x.fillText(fit(cat,W-160),W/2,285);
  x.fillStyle='#989da7';x.font=F(500,26);x.fillText(Lg.held===6?'Clasificación final':`Provisional · tras ${Lg.held} de 6 tiradas`,W/2,332);
  const cols=[{k:1,h:300,c:'#c9cdd5'},{k:0,h:400,c:'#ffd21f'},{k:2,h:230,c:'#d08a4c'}],bw=290,gap=26,x0=(W-(bw*3+gap*2))/2,base=1150;
  cols.forEach((cc,i)=>{const p=top[cc.k],bx=x0+i*(bw+gap),ty=base-cc.h;x.fillStyle=cc.c;x.beginPath();if(x.roundRect)x.roundRect(bx,ty,bw,cc.h,[22,22,6,6]);else x.rect(bx,ty,bw,cc.h);x.fill();
    x.fillStyle='#111';x.font=F(900,110);x.fillText(String(cc.k+1),bx+bw/2,ty+80);
    if(p){const w=p.name.split(' '),l1=w.slice(0,2).join(' '),l2=w.slice(2).join(' ');x.fillStyle='#fff';x.font=F(800,34);x.fillText(fit(l1,bw+10),bx+bw/2,ty-(l2?122:92));
      if(l2){x.font=F(600,26);x.fillStyle='#c9cdd5';x.fillText(fit(l2,bw+10),bx+bw/2,ty-86)}
      x.fillStyle=cc.c;x.font=F(900,40);x.fillText(`SCR ${p.scr}`,bx+bw/2,ty-40);x.fillStyle='#111';x.font=F(700,30);x.fillText(`${p.pts} pts`,bx+bw/2,ty+170)}
    else{x.fillStyle='#5a5f6a';x.font=F(600,30);x.fillText('—',bx+bw/2,ty-40)}});
  [['#f7f7f2',1],['#111',.8],['#1f7fe0',.6],['#e3262e',.4],['#ffd21f',.2]].forEach(([col,kk])=>{x.beginPath();x.arc(W/2-120,H-100,22*kk,0,Math.PI*2);x.fillStyle=col;x.fill()});
  x.fillStyle='#989da7';x.font=F(700,28);x.textAlign='left';x.fillText('Recorrido 3D',W/2-86,H-100);
  return new Promise(r=>c.toBlob(r,'image/png'))}
async function diplomaSheet(cat){const Lg=ligaCalc(ligaK),cats=Lg.groups.map(g=>g[0]);if(!cats.length)return;const meP=Lg.people.find(p=>isMe(p.name));
  if(!cat||!cats.includes(cat))cat=meP?meP.cat:cats[0];const blob=await diplomaBlob(ligaK,cat);if(!blob){toast('No se pudo crear la imagen');return}
  const url=URL.createObjectURL(blob),name=`podio_${slug(ligaName(ligaK))}_${slug(cat)}.png`,file=new File([blob],name,{type:'image/png'}),can=navigator.canShare&&navigator.canShare({files:[file]});
  sheet(`${shead('Diploma del podio')}<select class="in" id="dipcat" aria-label="Categoría">${cats.map(c=>`<option ${c===cat?'selected':''}>${esc(c)}</option>`).join('')}</select><img class="imgprev" src="${url}" alt="Podio de ${esc(cat)}">
  <div class="stack" style="margin-top:12px">${can?`<button class="btn wa wide" data-s="share">${WA_ICON} Compartir</button>`:''}<button class="btn wide" data-s="dl">⬇️ Guardar imagen</button></div>`,s=>{
  $('#dipcat',s).addEventListener('change',e=>diplomaSheet(e.target.value));
  s.addEventListener('click',async e=>{const b=e.target.closest('[data-s]');if(!b)return;if(b.dataset.s==='share')await nativeShare({files:[file],title:'Podio'});else dl(name,blob)})})}

   <div class="grid2" style="margin-top:8px"><button class="btn sm prim" data-act="backupNow">Guardar copia</button><button class="btn sm" data-act="snoozeBackup">Más tarde</button></div></div></div>`}

  ligaCsv,socAdd:()=>socSheet('add'),socManage:()=>socSheet('manage'),print:printSheet,closeJ:closeSheetJ,reopenJ,note:()=>{if(J().closed){closedMsg();return}noteSheet()},patrols:patSheet,upload:uploadSheet,
  xlsxOut:()=>saveFile(`liga_${slug(ligaName(ligaK))}.xlsx`,xlsxBlob(ligaK),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'),diploma:()=>diplomaSheet(),backupNow,snoozeBackup:()=>{db.settings.backupSnooze=Date.now()+3*864e5;save();render()},
  ligaWipe:async()=>{if(!(await ask(`Se borrarán las tiradas importadas (Excel, PDF o WhatsApp) de la ${ligaName(ligaK)}. Las jornadas anotadas en la app no se tocan.`,'Borrar',true)))return;const l=getLiga(ligaK);if(l){l.manual={};l.excel={}}db.ligas=db.ligas.filter(x=>Object.keys(x.manual).length||db.jornadas.some(j=>j.liga===x.k));save();render();toast('Tiradas del Excel borradas')}};
document.addEventListener('click',e=>{const t=e.target;let el;
  if(el=t.closest('[data-act]')){const f=ACT[el.dataset.act];if(f){f();return}}
  if(t.closest('.sheet')&&!t.closest('[data-stat],[data-tab]'))return;
  const card=t.closest('.ac');
  if(card){const aid=card.dataset.aid;
    if(el=t.closest('[data-v]')){setScore(aid,+el.dataset.v);return}
    if(el=t.closest('[data-slot]')){slotTap(aid,+el.dataset.slot);return}
    if(t.closest('[data-clra]')){clearArcher(aid);return}
    if(t.closest('.an')){statSheet(aid);return}}
  if(el=t.closest('[data-tab]')){closeSheet();go(el.dataset.tab);return}
  if(el=t.closest('[data-t]')){goT(+el.dataset.t);return}
  if(el=t.closest('[data-stat]')){statSheet(el.dataset.stat);return}
  if(el=t.closest('[data-rm]')){rankMode=el.dataset.rm;render();return}
  if(el=t.closest('[data-lm]')){ligaMode=el.dataset.lm;render();return}
  if(el=t.closest('[data-lp]')){const k=el.dataset.lp;if(ligaPick.has(k)){if(ligaPick.size>1)ligaPick.delete(k)}else ligaPick.add(k);render();return}
  if(el=t.closest('[data-lmet]')){ligaMetric=el.dataset.lmet;render();return}
  if(el=t.closest('[data-person]')){personSheet(el.dataset.person);return}
  if(el=t.closest('[data-ustep]')){const j=J(),cu=upTo(j)||j.n;let nu=cu+(+el.dataset.ustep);rankUpTo=nu>=j.n?0:Math.max(1,nu);render();return}
  if(el=t.closest('[data-open]')){db.activeId=el.dataset.open;undo=[];save();go('score');return}
  if(el=t.closest('[data-editj]')){jSheet(el.dataset.editj);return}
  if(el=t.closest('[data-dupj]')){jSheet(null,el.dataset.dupj);return}
  if(el=t.closest('[data-delj]')){delJ(el.dataset.delj);return}
  if(el=t.closest('[data-edita]')){editArcherSheet(el.dataset.edita);return}
  if(el=t.closest('[data-dela]')){delArcher(el.dataset.dela);return}
  if(el=t.closest('[data-up]')){moveUp(el.dataset.up);return}});
document.addEventListener('change',e=>{const id=e.target.id;if(id==='uptoSel'){rankUpTo=+e.target.value;render()}else if(id==='ligaSel'){ligaK=e.target.value;ligaPick=null;ligaCat=null;render()}else if(id==='ligaCatSel'){ligaCat=e.target.value;ligaPick=null;render()}});
document.addEventListener('submit',e=>{if(e.target.id==='addA'){e.preventDefault();addArcher(e.target)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('.sheetwrap'))closeSheet();
  if(view==='score'&&!$('.sheetwrap')&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'')&&J()){if(e.key==='ArrowRight')goT(J().cur+1);if(e.key==='ArrowLeft')goT(J().cur-1)}});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if(view==='jornadas')render()});
addEventListener('appinstalled',()=>{deferredPrompt=null;toast('¡App instalada!');render()});
addEventListener('resize',setAbh);
addEventListener('storage',e=>{if(e.key===KEY){db=load();render()}});

applyTheme();setAbh();render();
navigator.storage?.persist?.().catch(()=>{});
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'))
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
</body>
